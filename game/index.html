<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Emberfall — a top-down arena survival game. Keep the lantern's flame alive through five nights of shades.">
<title>Emberfall — Keep the Light Alive</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #070a18;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    background: #0b0e1e;
    box-shadow: 0 0 80px rgba(255, 159, 28, 0.12), 0 0 24px rgba(0, 0, 0, 0.6);
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<noscript><p style="color:#f4ead8;font-family:system-ui,sans-serif;text-align:center">Emberfall needs JavaScript to play.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
